name: Fetch assets

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "catalog or fetch"
        default: catalog
      ids:
        description: "comma-separated Poly Haven texture ids (fetch stage)"
        default: ""
      hdri:
        description: "Poly Haven HDRI id (fetch stage)"
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Prepare assets branch
        run: |
          git fetch origin assets || true
          if git rev-parse --verify origin/assets >/dev/null 2>&1; then git checkout -B assets origin/assets; else git checkout --orphan assets && git rm -rf . >/dev/null && git clean -fdx; fi
          git checkout main -- tools || true
      - name: Mechs (Quaternius Animated Mech Pack, CC0)
        if: inputs.stage == 'catalog' || inputs.stage == 'mechs'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq blender >/dev/null
          mkdir -p raw && cd raw
          curl -sSL -A "Mozilla/5.0" -o mechs.zip https://opengameart.org/sites/default/files/animated_mech_pack_-_march_2021.zip
          curl -sSL -A "Mozilla/5.0" -o ../mech_preview.jpg https://opengameart.org/sites/default/files/preview_281.jpg || true
          unzip -q -o mechs.zip -d mechs
          find mechs -type f | sed 's/^/  /' > ../mech_files.txt
          cd ..
          mkdir -p assets/mechs
          cp "raw/mechs/Animated Mech Pack - March 2021/Preview.jpg" assets/mechs/preview.jpg || true
          cp "raw/mechs/Animated Mech Pack - March 2021/Preview2.png" assets/mechs/preview2.png || true
          cp "raw/mechs/Animated Mech Pack - March 2021/License.txt" assets/mechs/LICENSE.txt || true
          cat > /tmp/exp.py <<'PY'
          import bpy, sys
          out = sys.argv[sys.argv.index("--") + 1]
          for o in bpy.data.objects:
              o.hide_set(False); o.hide_viewport=False; o.hide_render=False
          bpy.ops.export_scene.gltf(filepath=out, export_format='GLB', export_animations=True, export_yup=True)
          print("ACTIONS:", [a.name for a in bpy.data.actions])
          PY
          find raw/mechs -iname '*.blend' -print0 | while IFS= read -r -d '' f; do
            n=$(basename "$f" .blend)
            blender -b "$f" --python /tmp/exp.py -- "assets/mechs/$n.glb" 2>&1 | grep -E "ACTIONS|Error|rror" | head -5 >> mech_files.txt
          done
          ls -la assets/mechs >> mech_files.txt
          rm -rf raw
      - name: Texture and HDRI catalog (Poly Haven, CC0)
        if: inputs.stage == 'catalog' && false
        run: python3 tools/polyhaven.py catalog
      - name: Fetch chosen textures
        if: inputs.stage == 'fetch'
        run: python3 tools/polyhaven.py fetch "${{ inputs.ids }}" "${{ inputs.hdri }}"
      - name: Commit
        run: |
          rm -rf tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fetch assets (${{ inputs.stage }})" || echo "nothing to commit"
          git push origin assets
