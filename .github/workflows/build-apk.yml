name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Wrap the game in a Capacitor Android app
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www && cp ../index.html ../three.min.js www/
          npx cap init "Iron Swarm" com.ironswarm.game --web-dir www
          npx cap add android
          # lock to landscape
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: iron-swarm-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk iron-swarm.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest iron-swarm.apk --title "Iron Swarm (latest build)" --notes "Tap iron-swarm.apk below to download, then open it to install."
